<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Interview Report | ASCEND</title>
  <link rel="stylesheet" href="css/app-theme.css">
  <style>
    :root { color-scheme: light; --ink: #17233b; --muted: #64748b; --line: #e2e8f0; --brand: #4859ca; --surface: #fff; --page: #f5f7fb; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
    button:focus-visible { outline: 3px solid #8793ff; outline-offset: 3px; }
    .page { width: min(1050px, calc(100% - 32px)); margin: 34px auto 60px; }
    .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    .eyebrow { color: var(--brand); font-size: .75rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 7px 0; font-size: clamp(1.7rem, 4vw, 2.4rem); }
    .muted { color: var(--muted); line-height: 1.55; }
    .actions { display: flex; flex-wrap: wrap; gap: 9px; }
    button { min-height: 42px; padding: 0 14px; border: 1px solid #cbd5e1; border-radius: 10px; background: #fff; color: #24324b; cursor: pointer; font: inherit; font-weight: 750; }
    button:hover { background: #f6f7ff; border-color: #9aa5df; }
    button.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
    button.primary:hover { background: #3343ac; }
    .summary { display: grid; grid-template-columns: minmax(190px, .7fr) 1.3fr; align-items: center; gap: 28px; padding: 24px; border: 1px solid var(--line); border-radius: 20px; background: var(--surface); box-shadow: 0 12px 35px #1a2a4b0d; }
    .score-ring { --score: 0%; display: grid; place-items: center; width: clamp(150px, 35vw, 190px); aspect-ratio: 1; margin: auto; border-radius: 50%; background: conic-gradient(var(--brand) var(--score), #e8ebf3 var(--score)); }
    .score-inner { display: grid; place-content: center; width: 78%; aspect-ratio: 1; border-radius: 50%; background: #fff; text-align: center; }
    .score-value { font-size: 2.55rem; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
    .score-caption { margin-top: 6px; color: var(--muted); font-size: .82rem; font-weight: 700; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 18px; }
    .metric { padding: 13px 10px; border: 1px solid var(--line); border-radius: 12px; background: #fbfcff; text-align: center; }
    .metric strong { display: block; font-size: 1.15rem; }
    .metric span { color: var(--muted); font-size: .79rem; }
    .insights { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 18px 0; }
    .panel, .question-card { border: 1px solid var(--line); border-radius: 16px; padding: 20px; background: #fff; }
    .panel h2, .questions-title { margin: 0 0 12px; font-size: 1.12rem; }
    .list { margin: 0; padding-left: 20px; color: #53627a; line-height: 1.65; }
    .empty { color: var(--muted); margin: 0; line-height: 1.55; }
    .questions-title { margin: 24px 0 12px; }
    .question-list { display: grid; gap: 14px; }
    .question-card h3 { margin: 0 0 12px; font-size: 1rem; line-height: 1.45; }
    .q-heading { display: flex; justify-content: space-between; gap: 14px; align-items: flex-start; }
    .badge { flex: 0 0 auto; border-radius: 999px; padding: 5px 10px; background: #eef0ff; color: #3545b2; font-size: .82rem; font-weight: 850; }
    .detail { margin: 12px 0; }
    .detail strong { display: block; margin-bottom: 5px; font-size: .8rem; letter-spacing: .04em; text-transform: uppercase; }
    .detail p { margin: 0; color: #526179; line-height: 1.55; overflow-wrap: anywhere; }
    .keywords { display: flex; flex-wrap: wrap; gap: 7px; }
    .keyword { padding: 4px 8px; border: 1px solid var(--line); border-radius: 999px; color: #526179; font-size: .79rem; }
    .keyword.matched { border-color: #b7e5ce; background: #f0fbf5; color: #21744a; }
    .keyword.missing { border-color: #f1c7c7; background: #fff6f6; color: #a12828; }
    .status { color: var(--muted); font-size: .82rem; font-weight: 750; }
    .loading { padding: 35px 20px; border: 1px solid var(--line); border-radius: 16px; background: #fff; text-align: center; }
    .error { color: #a12828; }
    @media (max-width: 700px) {
      .top { display: block; }
      .actions { margin-top: 15px; }
      .summary { grid-template-columns: 1fr; gap: 10px; }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .insights { grid-template-columns: 1fr; }
    }
    @media print {
      body { background: #fff; }
      .page { width: 100%; margin: 0; }
      .actions { display: none; }
      .summary, .panel, .question-card { box-shadow: none; break-inside: avoid; }
      .question-list { gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <div class="eyebrow">ASCEND interview practice</div>
        <h1 id="report-title">Your interview report</h1>
        <p class="muted" id="report-subtitle">A review of your practice session.</p>
      </div>
      <nav class="actions" aria-label="Report actions">
        <button id="retake-button" type="button">Retake interview</button>
        <button id="print-button" type="button">Print report</button>
        <button class="primary" id="dashboard-button" type="button">Back to dashboard</button>
      </nav>
    </header>
    <div id="report-error" class="loading error" role="alert" hidden></div>
    <div id="report-loading" class="loading" role="status">Loading your report…</div>
    <div id="report-content" hidden>
      <section class="summary" aria-label="Overall interview score">
        <div class="score-ring" id="score-ring" role="img">
          <div class="score-inner"><span class="score-value" id="score-value">0%</span><span class="score-caption">overall score</span></div>
        </div>
        <div>
          <div class="eyebrow" id="role-label"></div>
          <h2 id="score-summary">Interview complete</h2>
          <p class="muted" id="score-description"></p>
          <div class="metrics">
            <div class="metric"><strong id="metric-time">0:00</strong><span>Time used</span></div>
            <div class="metric"><strong id="metric-answered">0</strong><span>Answered</span></div>
            <div class="metric"><strong id="metric-skipped">0</strong><span>Skipped</span></div>
            <div class="metric"><strong id="metric-unanswered">0</strong><span>Unanswered</span></div>
          </div>
        </div>
      </section>
      <section class="insights" aria-label="Interview insights">
        <article class="panel"><h2>Strengths</h2><ul class="list" id="strength-list"></ul><p class="empty" id="strength-empty" hidden></p></article>
        <article class="panel"><h2>Focus areas</h2><ul class="list" id="focus-list"></ul><p class="empty" id="focus-empty" hidden></p></article>
      </section>
      <h2 class="questions-title">Question-by-question review</h2>
      <section class="question-list" id="question-list" aria-label="Question review"></section>
    </div>
  </main>
  <script src="js/userContext.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('sessionId') || localStorage.getItem('interview_session_id');
      const loading = document.getElementById('report-loading');
      const content = document.getElementById('report-content');
      const errorBox = document.getElementById('report-error');

      function formatDuration(seconds) {
        const minutes = Math.floor(seconds / 60);
        const remainder = seconds % 60;
        return `${minutes}:${String(remainder).padStart(2, '0')}`;
      }

      function addListItems(list, empty, values, emptyText) {
        list.replaceChildren();
        if (!values.length) {
          list.hidden = true;
          empty.hidden = false;
          empty.textContent = emptyText;
          return;
        }
        list.hidden = false;
        empty.hidden = true;
        values.forEach(value => {
          const item = document.createElement('li');
          item.textContent = value;
          list.append(item);
        });
      }

      function addText(parent, tag, className, value) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        node.textContent = value;
        parent.append(node);
        return node;
      }

      function renderQuestion(attempt, index) {
        const card = document.createElement('article');
        card.className = 'question-card';
        const heading = document.createElement('div');
        heading.className = 'q-heading';
        const title = document.createElement('h3');
        title.textContent = `Question ${index + 1}: ${attempt.questionText}`;
        const score = document.createElement('span');
        score.className = 'badge';
        score.textContent = `${Number(attempt.score || 0).toFixed(1)} / 10`;
        heading.append(title, score);
        card.append(heading);
        addText(card, 'div', 'status', `${attempt.status || 'ANSWERED'} · ${formatDuration(attempt.timeTakenSeconds || 0)}`);

        const answer = document.createElement('div');
        answer.className = 'detail';
        addText(answer, 'strong', '', 'Your answer');
        addText(answer, 'p', '', attempt.userAnswer || 'No response recorded.');
        card.append(answer);

        const keywords = document.createElement('div');
        keywords.className = 'detail';
        addText(keywords, 'strong', '', 'Keywords');
        const keywordList = document.createElement('div');
        keywordList.className = 'keywords';
        (attempt.matchedKeywords || []).forEach(word => addText(keywordList, 'span', 'keyword matched', `Matched: ${word}`));
        (attempt.missingKeywords || []).forEach(word => addText(keywordList, 'span', 'keyword missing', `To cover: ${word}`));
        if (!keywordList.childElementCount) addText(keywordList, 'span', 'empty', 'No keyword guidance for this question.');
        keywords.append(keywordList);
        card.append(keywords);

        const feedback = document.createElement('div');
        feedback.className = 'detail';
        addText(feedback, 'strong', '', 'Feedback');
        addText(feedback, 'p', '', attempt.feedback || 'No feedback was recorded.');
        card.append(feedback);

        const example = document.createElement('div');
        example.className = 'detail';
        addText(example, 'strong', '', 'Example answer');
        addText(example, 'p', '', attempt.exampleAnswer || 'No example answer is available for this question.');
        card.append(example);
        return card;
      }

      function render(report) {
        const percentage = Math.min(100, Math.max(0, Number(report.percentage || 0)));
        const scoreRing = document.getElementById('score-ring');
        scoreRing.style.setProperty('--score', `${percentage}%`);
        scoreRing.setAttribute('aria-label', `Overall score ${percentage} percent`);
        document.getElementById('score-value').textContent = `${percentage}%`;
        document.getElementById('role-label').textContent = `${report.role} · ${report.type} · ${report.experience} · ${report.difficulty}`;
        document.getElementById('score-summary').textContent = percentage >= 80 ? 'Excellent work' : percentage >= 60 ? 'Good progress' : 'A useful place to grow';
        document.getElementById('score-description').textContent = `You scored ${Number(report.totalScore || 0).toFixed(1)} out of ${Number(report.plannedQuestionCount || 0) * 10} points across ${report.plannedQuestionCount} planned questions.`;
        document.getElementById('report-subtitle').textContent = report.endReason === 'TIME_UP'
          ? 'Your time ended. Review what went well and what to practice next.'
          : 'Review your answers, feedback, and next focus areas.';
        document.getElementById('metric-time').textContent = formatDuration(report.timeUsedSeconds || 0);
        document.getElementById('metric-answered').textContent = report.answered;
        document.getElementById('metric-skipped').textContent = report.skipped;
        document.getElementById('metric-unanswered').textContent = report.unanswered;
        addListItems(document.getElementById('strength-list'), document.getElementById('strength-empty'), report.strengths || [], 'Keep practicing to identify stronger examples.');
        addListItems(document.getElementById('focus-list'), document.getElementById('focus-empty'), report.focusAreas || [], 'No additional focus areas were identified.');
        const questionList = document.getElementById('question-list');
        questionList.replaceChildren(...(report.attempts || []).map(renderQuestion));
        if (!report.attempts?.length) addText(questionList, 'p', 'empty', 'No question details were saved.');
        loading.hidden = true;
        errorBox.hidden = true;
        content.hidden = false;
      }

      async function loadReport() {
        if (!sessionId) {
          loading.hidden = true;
          errorBox.hidden = false;
          errorBox.textContent = 'No interview session was found. Start a new interview from setup.';
          return;
        }
        loading.hidden = false;
        errorBox.hidden = true;
        content.hidden = true;
        try {
          const response = await UserContext.fetchWithAuth(`/api/interview/${encodeURIComponent(sessionId)}/report`);
          const result = await response.json();
          if (!response.ok || !result.success) throw new Error(result.error || 'Unable to load the report.');
          render(result.data);
        } catch (error) {
          if (UserContext.isSessionExpired(error)) return;
          loading.hidden = true;
          errorBox.hidden = false;
          errorBox.replaceChildren();
          addText(errorBox, 'p', '', error.message || 'Unable to load your report.');
          const retry = document.createElement('button');
          retry.type = 'button';
          retry.textContent = 'Retry';
          retry.addEventListener('click', loadReport);
          errorBox.append(retry);
        }
      }

      document.getElementById('retake-button').addEventListener('click', () => {
        localStorage.removeItem('interview_session_id');
        localStorage.removeItem('interview_config');
        window.location.assign('mock_interview_setup.html');
      });
      document.getElementById('print-button').addEventListener('click', () => window.print());
      document.getElementById('dashboard-button').addEventListener('click', () => window.location.assign('dashboard.html'));
      loadReport();
    })();
  </script>
</body>
</html>
